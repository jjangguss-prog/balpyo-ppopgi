<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="사원 이름이 든 공을 뽑는 게임. 로또 기계, 대포, 바로 뽑기 중에 고르고, 한 번 뽑힌 사람은 다시 안 나와요. 2명 함께 뽑기도 돼요.">
<meta name="theme-color" content="#aab2b7">
<meta property="og:type" content="website">
<meta property="og:title" content="사원 뽑기">
<meta property="og:description" content="사원 이름이 든 공을 뽑는 게임. 로또 기계, 대포, 바로 뽑기 중에 고르고, 한 번 뽑힌 사람은 다시 안 나와요. 2명 함께 뽑기도 돼요.">
<meta property="og:url" content="https://jjangguss-prog.github.io/balpyo-ppopgi/team.html">
<meta property="og:image" content="https://jjangguss-prog.github.io/balpyo-ppopgi/og.png">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="420">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f9c22e'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23fffdf5'/%3E%3C/svg%3E">
<title>사원 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* 레이아웃: 나무 틀에 걸린 칠판 한 장. 왼쪽 추첨기, 오른쪽 뽑힌 사람, 아래 참가자 이름, 맨 아래 분필 받침대에 조작 버튼 */
:root{
  --board:#1f3b32; --smudge:rgba(255,255,255,.045); --inset:rgba(0,0,0,.34);
  --chalk:#f1eee2; --chalk-dim:rgba(241,238,226,.68); --chalk-faint:rgba(241,238,226,.2);
  --mark:#f5d06a; --away:#f2a19a;
  --accent:#f5d06a; --accent-ink:#1c2a24; --accent-lo:#b8922f;
  --frame-a:#a06d42; --frame-b:#774c2a; --grain:rgba(0,0,0,.07); --grain-hi:rgba(255,255,255,.05);
  --tray-ink:#fff4e2; --tray-dim:rgba(255,244,226,.72); --seg-bg:rgba(40,22,8,.34); --seg-on:#fff1d6; --seg-on-ink:#3b2716;
  --panel:#264538; --panel-line:rgba(241,238,226,.18); --input-bg:rgba(0,0,0,.2);
  --glass:rgba(241,238,226,.05); --glass-edge:rgba(241,238,226,.13); --glass-line:rgba(241,238,226,.82); --gloss:rgba(255,255,255,.3);
  --stand:#152a23; --iron:#2c3330; --iron-hi:#56625d; --wood:#b98451;
  --smoke:241,238,226; --spark:#ffd877;
  --face:#fffdf5; --face-ink:#1d1f24;
  --font-display:"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --font-hand:"Gaegu","Nanum Pen Script","Malgun Gothic",cursive;
  --font-ui:"Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-board="white"]{
  --board:#f4f6f5; --smudge:rgba(120,140,150,.07); --inset:rgba(30,40,50,.12);
  --chalk:#1f2b3a; --chalk-dim:rgba(31,43,58,.64); --chalk-faint:rgba(31,43,58,.17);
  --mark:#2457c5; --away:#d2412f;
  --accent:#2457c5; --accent-ink:#ffffff; --accent-lo:#173c8c;
  --frame-a:#dde1e4; --frame-b:#aab2b7; --grain:rgba(255,255,255,.35); --grain-hi:rgba(0,0,0,.03);
  --tray-ink:#1f2b3a; --tray-dim:rgba(31,43,58,.7); --seg-bg:rgba(255,255,255,.6); --seg-on:#1f2b3a; --seg-on-ink:#ffffff;
  --panel:#ffffff; --panel-line:rgba(31,43,58,.15); --input-bg:#f3f5f7;
  --glass:rgba(150,185,205,.06); --glass-edge:rgba(150,185,205,.2); --glass-line:rgba(31,43,58,.72); --gloss:rgba(255,255,255,.95);
  --stand:#dfe4e7; --iron:#3a4247; --iron-hi:#7a868d; --wood:#c48d58;
  --smoke:150,160,172; --spark:#ff9f1c;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden;
  display:grid; grid-template-rows:minmax(0,1fr) auto;
  padding-inline:16px; padding-block:14px 0;
  background-color:var(--frame-b);
  background-image:
    repeating-linear-gradient(178deg, var(--grain) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(181deg, var(--grain-hi) 0 1px, transparent 1px 17px),
    linear-gradient(180deg, var(--frame-a), var(--frame-b));
  color:var(--chalk); font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--mark); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

#fx{position:fixed; inset:0; z-index:3; pointer-events:none}

/* 칠판 */
.board{
  position:relative; min-height:0;
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:4px;
  padding:10px clamp(14px,2vw,26px) 12px;
  border-radius:6px 6px 0 0;
  background-color:var(--board);
  background-image:
    radial-gradient(55% 38% at 22% 30%, var(--smudge), transparent 70%),
    radial-gradient(45% 32% at 80% 72%, var(--smudge), transparent 70%),
    var(--noise, none);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25), inset 0 8px 22px var(--inset);
}

.head{display:flex; align-items:center; justify-content:space-between; gap:6px 16px; flex-wrap:wrap; min-height:44px}
.title{margin:0; display:flex; align-items:center; gap:10px; font:700 clamp(26px,3.4vh,36px)/1 var(--font-hand); letter-spacing:.02em}
.title svg{width:1.45em; height:auto; flex:none}
.corner{display:flex; align-items:center; gap:4px 18px; flex-wrap:wrap; font:700 clamp(19px,2.5vh,26px)/1.1 var(--font-hand); color:var(--chalk-dim)}
.team{color:var(--chalk)}

/* 무대: 추첨기 + 결과 */
.stage{position:relative; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stage[data-machine="quick"]{grid-template-columns:0 minmax(0,1fr)}
.machine{min-width:0; min-height:0; overflow:hidden}
.result{
  position:relative; container-type:size; min-width:0; min-height:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.4cqh;
}
.slots{display:flex; align-items:center; justify-content:center; gap:3cqw}
.slots[data-n="1"]{--ball:min(62cqh, 62cqw)}
.slots[data-n="2"]{--ball:min(52cqh, 33cqw)}
.slot{margin:0; display:flex; flex-direction:column; align-items:center; gap:1.4cqh}
.role{font:700 clamp(17px,4cqh,32px)/1 var(--font-hand); color:var(--chalk-dim); letter-spacing:.02em}
.ball{
  position:relative; width:var(--ball); max-width:100%; aspect-ratio:1; border-radius:50%;
  display:grid; place-items:center;
  background:radial-gradient(circle calc(var(--ball) * .68) at 33% 30%, var(--hi) 0, var(--c) 45%, var(--lo) 100%);
  box-shadow:0 calc(var(--ball) * .04) calc(var(--ball) * .09) rgba(0,0,0,.32);
}
.ball::after{content:""; position:absolute; left:24%; top:15%; width:26%; height:14%; border-radius:50%; background:rgba(255,255,255,.5); transform:rotate(-34deg)}
/* 공 가운데 흰 원에 이름. 글자 크기(--fs)는 이름 길이에 맞춰 fitSize()가 정한다 */
.face{
  width:64%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center;
  background:var(--face); color:var(--face-ink); white-space:nowrap;
  font:calc(var(--ball) * var(--fs, .36))/1 var(--font-display); padding-top:.05em;
}
.ball.empty{background:none; box-shadow:none; border:3px dashed var(--chalk-faint)}
.ball.empty::after{display:none}
.q{font:700 calc(var(--ball) * .46)/1 var(--font-hand); color:var(--chalk-faint)}
.ball.none .q{font-size:calc(var(--ball) * .15)}
.ball.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.3)}
.ball.pop::before{content:""; position:absolute; inset:-4%; border-radius:50%; border:4px solid var(--mark); opacity:0; animation:ring .75s ease-out}
.ball.spin{animation:tick .08s ease-out}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes ring{0%{opacity:.95; transform:scale(1)}100%{opacity:0; transform:scale(1.35)}}
@keyframes tick{0%{transform:scale(.95)}100%{transform:scale(1)}}
.pair-link{display:flex; flex-direction:column; align-items:center; gap:.35em; color:var(--chalk-dim); font:700 clamp(15px,3.2cqh,26px)/1 var(--font-hand); white-space:nowrap}
.pair-link svg{width:clamp(36px,8cqh,72px); height:auto}

.under{min-height:3.4em; display:grid; place-items:center; text-align:center; padding-inline:8px}
.hint{margin:0; font:clamp(15px,2.6cqh,20px)/1.4 var(--font-ui); color:var(--chalk-dim)}
.hint kbd{font:inherit; padding:.05em .45em; border:1.5px solid var(--chalk-faint); border-radius:6px}
.done{margin:0; font:700 clamp(21px,4.6cqh,38px)/1.2 var(--font-hand); color:var(--mark)}
.done small{display:block; margin-top:.2em; font:clamp(14px,2.4cqh,18px)/1.4 var(--font-ui); color:var(--chalk-dim)}
.toast{
  position:absolute; left:50%; bottom:6px; z-index:1; max-width:92%;
  transform:translate(-50%,8px); opacity:0; pointer-events:none;
  padding:8px 16px; border-radius:999px; border:1.5px solid var(--panel-line);
  background:var(--panel); color:var(--chalk); font:15px/1.3 var(--font-ui); text-align:center;
  transition:opacity .2s, transform .2s;
}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* 참가자 이름 */
.roll{display:grid; gap:6px; padding-top:8px; border-top:2px dashed var(--chalk-faint)}
.roll-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 16px}
.roll h2{margin:0; font:700 21px/1 var(--font-hand)}
.tip{margin:0; flex:1 1 260px; min-width:0; font:14.5px/1.35 var(--font-ui); color:var(--chalk-dim)}
.legend{margin:0; display:flex; gap:16px; font:700 17px/1 var(--font-hand); color:var(--chalk-dim)}
.legend b{font:19px/1 var(--font-display); color:var(--chalk); font-variant-numeric:tabular-nums}
.lg{display:inline-flex; align-items:center; gap:5px}
.lg::before{content:""; width:16px; height:16px; flex:none}
.lg-left::before{border-radius:50%; background:var(--chalk); transform:scale(.45)}
.lg-done::before{height:3px; background:var(--chalk-dim); transform:rotate(-16deg); border-radius:2px}
.lg-away::before{border:2px dashed var(--away); border-radius:50%}
.nums{display:grid; grid-template-columns:repeat(auto-fill, minmax(128px,1fr)); gap:6px}
.num{
  position:relative; height:48px; padding:0 10px; border:0; border-radius:12px; background:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:9px;
  font:25px/1 var(--font-display); color:var(--chalk); white-space:nowrap;
  transition:background .15s;
}
.num:hover{background:var(--chalk-faint)}
.dot{width:14px; height:14px; flex:none; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--hi), var(--c) 55%, var(--lo))}
.num[data-s="done"]{color:var(--chalk-dim)}
.num[data-s="done"] .dot{opacity:.45}
.num[data-s="done"]::after{content:""; position:absolute; left:14%; width:72%; top:calc(50% - 1.5px); height:3px; border-radius:2px; background:var(--chalk); opacity:.85; transform:rotate(-7deg)}
.num[data-s="away"]{color:var(--away)}
.num[data-s="away"]::before{content:""; position:absolute; inset:4px; border:2px dashed var(--away); border-radius:12px}
.num[data-last]{color:var(--mark)}
.num[data-last]::after{display:none}
.num[data-last]::before{content:""; position:absolute; inset:2px; border:3px solid var(--mark); border-radius:16px 12px 18px 11px / 12px 18px 11px 16px; transform:rotate(-2deg)}
body.busy .num{pointer-events:none}

/* 분필 받침대 */
.tray{
  position:relative; z-index:4;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px 18px;
  padding:10px clamp(12px,2vw,24px) calc(12px + env(safe-area-inset-bottom, 0px));
  background:
    repeating-linear-gradient(179deg, var(--grain) 0 2px, transparent 2px 9px),
    linear-gradient(180deg, var(--frame-a), var(--frame-b));
  box-shadow:0 -10px 18px -10px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.28);
  color:var(--tray-ink);
}
.group{display:flex; align-items:flex-end; gap:10px 16px; flex-wrap:wrap}
.field{display:grid; gap:5px}
.flabel{font:700 15px/1 var(--font-hand); color:var(--tray-dim); padding-left:6px}
.seg{display:inline-flex; padding:3px; gap:2px; border-radius:999px; background:var(--seg-bg)}
.seg button{border:0; background:none; padding:8px 14px; border-radius:999px; font:16px/1 var(--font-ui); color:var(--tray-ink); cursor:pointer; white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--seg-on); color:var(--seg-on-ink); box-shadow:0 1px 3px rgba(0,0,0,.25)}
.seg button:disabled{cursor:default; opacity:.55}
.draw-wrap{display:grid; justify-items:center; gap:6px}
.draw{
  display:inline-flex; align-items:center; justify-content:center; gap:12px; min-width:220px;
  padding:12px 34px 13px; border:0; border-radius:999px; cursor:pointer;
  background:var(--accent); color:var(--accent-ink);
  font:clamp(27px,3.6vh,34px)/1 var(--font-display);
  box-shadow:0 5px 0 var(--accent-lo), 0 10px 18px rgba(0,0,0,.3);
  transition:transform .08s, box-shadow .08s;
}
.draw:active{transform:translateY(4px); box-shadow:0 1px 0 var(--accent-lo), 0 4px 8px rgba(0,0,0,.3)}
.draw:disabled{cursor:progress; opacity:.8}
.draw kbd{font:13px/1 var(--font-ui); padding:4px 7px; border-radius:6px; border:1.5px solid currentColor; opacity:.6}
.left{font:700 16px/1 var(--font-hand); color:var(--tray-dim); font-variant-numeric:tabular-nums}
.tools{align-items:center}
.tool{display:inline-flex; align-items:center; gap:6px; border:0; border-radius:999px; padding:9px 14px; background:var(--seg-bg); color:var(--tray-ink); font:15px/1 var(--font-ui); cursor:pointer; white-space:nowrap}
.icon{width:40px; height:40px; display:grid; place-items:center; border:0; border-radius:50%; background:var(--seg-bg); color:var(--tray-ink); cursor:pointer}
.tool svg,.icon svg{width:19px; height:19px}
.tool:hover:not(:disabled),.icon:hover:not(:disabled),.seg button:hover:not(:disabled):not([aria-checked="true"]){background:var(--chalk-faint)}
.tool:disabled,.icon:disabled{opacity:.45; cursor:default}

/* 창 */
dialog{
  border:0; padding:0; border-radius:18px; width:min(560px, calc(100vw - 32px)); max-height:calc(100vh - 32px);
  background:var(--panel); color:var(--chalk); box-shadow:0 24px 70px rgba(0,0,0,.5);
}
dialog::backdrop{background:rgba(8,14,12,.55)}
.dlg{display:grid}
.dlg-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 22px 10px}
.dlg h2{margin:0; font:700 27px/1.1 var(--font-hand)}
.dlg p{margin:0; font:16px/1.5 var(--font-ui); color:var(--chalk-dim)}
.dlg-sec{display:grid; gap:10px; padding:14px 22px; border-top:1.5px dashed var(--panel-line)}
.dlg h3{margin:0; font:700 19px/1 var(--font-hand); color:var(--chalk-dim)}
.fld{display:grid; gap:6px; font-size:14px; color:var(--chalk-dim)}
.fld input,.fld textarea{width:100%; font:16px/1.45 var(--font-ui); color:var(--chalk); background:var(--input-bg); border:1.5px solid var(--panel-line); border-radius:10px; padding:9px 12px}
.fld textarea{resize:vertical; min-height:110px}
.info{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; font-size:14px; color:var(--chalk-dim)}
.row-actions{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1.5px solid var(--panel-line); background:none; padding:9px 15px; border-radius:999px; cursor:pointer; font:15px/1 var(--font-ui)}
.btn:hover:not(:disabled){background:var(--chalk-faint)}
.btn:disabled{opacity:.45; cursor:default}
.btn.small{padding:6px 11px; font-size:14px}
.btn.danger{color:var(--away); border-color:currentColor}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn.primary:hover{background:var(--accent); filter:brightness(1.06)}
.x{width:38px; height:38px; border-radius:50%; border:0; background:var(--input-bg); cursor:pointer; font-size:22px; line-height:1}
.dlg .seg{background:var(--input-bg)}
.dlg .seg button{color:var(--chalk)}
.dlg .seg button[aria-checked="true"]{background:var(--chalk); color:var(--panel)}
.keys dl{display:grid; grid-template-columns:auto minmax(0,1fr); gap:7px 16px; margin:0; font-size:14.5px; line-height:1.4}
.keys dt{color:var(--chalk)}
.keys dd{margin:0; color:var(--chalk-dim)}
.dlg-foot{display:flex; justify-content:flex-end; gap:8px; padding:12px 22px 20px}


/* 좁은 화면, 세로 화면 */
@media (max-width:760px), (max-aspect-ratio:4/5){
  body{overflow:auto; display:block; height:auto; min-height:100%; padding-bottom:calc(92px + env(safe-area-inset-bottom, 0px))}
  .board{display:block}
  .stage{grid-template-columns:minmax(0,1fr); grid-template-rows:min(30vh,320px) auto}
  .stage[data-machine="quick"]{grid-template-columns:minmax(0,1fr); grid-template-rows:0 auto}
  .result{height:min(44vh,520px)}
  .slots[data-n="2"]{--ball:min(42cqh, 34cqw)}
  .roll{margin-top:10px}
  .tray{justify-content:center; padding-bottom:16px}
  .group{justify-content:center}
  /* 휴대폰에서는 뽑기 버튼만 화면 아래에 붙여 둔다 */
  .draw-wrap{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px;
    padding:10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(180deg, var(--frame-a), var(--frame-b));
    box-shadow:0 -8px 18px -8px rgba(0,0,0,.5);
  }
  .draw{width:100%; min-width:0}
}
@media (prefers-reduced-motion:reduce){
  .ball.pop,.ball.pop::before,.ball.spin{animation:none}
  .draw,.toast{transition:none}
}
</style>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="board" id="board">
  <header class="head">
    <h1 class="title">
      <svg viewBox="0 0 56 34" aria-hidden="true">
        <circle cx="12" cy="20" r="10.5" fill="#f9c22e"/><circle cx="12" cy="20" r="5" fill="#fffdf5"/>
        <circle cx="28" cy="13" r="10.5" fill="#47a6e6"/><circle cx="28" cy="13" r="5" fill="#fffdf5"/>
        <circle cx="44" cy="21" r="10.5" fill="#f2615d"/><circle cx="44" cy="21" r="5" fill="#fffdf5"/>
      </svg>
      사원 뽑기
    </h1>
    <div class="corner">
      <span id="today"></span>
      <span class="team" id="teamName"></span>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="machine" id="machine" aria-hidden="true"></div>
    <section class="result" aria-label="뽑힌 사람">
      <div class="slots" id="slots" data-n="1"></div>
      <div class="under">
        <p class="hint" id="hint"><kbd>스페이스바</kbd>나 아래 <b>뽑기</b> 버튼을 누르세요</p>
        <p class="done" id="done" hidden>모두 한 번씩 뽑혔어요!<small>처음부터를 누르면 모두 다시 넣고 뽑아요.</small></p>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <section class="roll" aria-labelledby="rollTitle">
    <div class="roll-head">
      <h2 id="rollTitle">참가자</h2>
      <p class="tip">이름을 누르면 오늘은 빼고 뽑아요 (휴가, 외근 등). 줄 그어진 이름을 누르면 다시 넣어요.</p>

{

/* ---------- 소리 (파일 없이 직접 만든다) ---------- */

/* ---------- 조각들: 연기, 불티, 색종이 ---------- */

  // 바퀴
  c.save(); c.translate(rx, pivot.y); c.rotate(-Cannon.recoil / wheelR);
  c.strokeStyle = T.wood; c.lineWidth = wheelR * .12;
  for (let k = 0; k < 8; k++) { const a = k * TAU / 8; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * wheelR * .82, Math.sin(a) * wheelR * .82); c.stroke(); }
  c.lineWidth = wheelR * .2; c.beginPath(); c.arc(0, 0, wheelR * .88, 0, TAU); c.stroke();
  c.strokeStyle = T.chalk; c.lineWidth = lw;
  c.beginPath(); c.arc(0, 0, wheelR, 0, TAU); c.stroke(); c.beginPath(); c.arc(0, 0, wheelR * .77, 0, TAU); c.stroke();
  c.fillStyle = T.iron; c.beginPath(); c.arc(0, 0, wheelR * .2, 0, TAU); c.fill(); c.stroke();
  c.restore();
  // 포구 불꽃
  if (Cannon.flash > 0) {
    const M = Cannon.muzzle(G, Cannon.angle), fr = s * .2 * (1.3 - Cannon.flash * .3);
    const g = c.createRadialGradient(M.x, M.y, 0, M.x, M.y, fr);
    g.addColorStop(0, `rgba(255,250,215,${Cannon.flash})`); g.addColorStop(.4, `rgba(255,200,90,${Cannon.flash * .8})`); g.addColorStop(1, 'rgba(255,160,60,0)');
    c.fillStyle = g; c.beginPath(); c.arc(M.x, M.y, fr, 0, TAU); c.fill();
  }
  c.restore();
}
function drawBarrel(len, bw, lw) {
  const c = ctx, x0 = -len * .17, x1 = len * .72, xe = x1 - bw * .16, hb = bw / 2, hm = bw * .38;
  const g = c.createLinearGradient(0, -hb, 0, hb); g.addColorStop(0, T.ironHi); g.addColorStop(.5, T.iron); g.addColorStop(1, T.iron);
  c.lineWidth = lw; c.strokeStyle = T.chalk;
  c.fillStyle = T.iron; c.beginPath(); c.arc(x0 - bw * .2, 0, bw * .17, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = g; c.beginPath(); c.moveTo(x0, -hb); c.lineTo(xe, -hm); c.lineTo(xe, hm); c.lineTo(x0, hb); c.quadraticCurveTo(x0 - bw * .22, 0, x0, -hb); c.closePath(); c.fill(); c.stroke();
  rr(c, x1 - bw * .2, -hb * .96, bw * .2, hb * 1.92, lw * 1.5); c.fill(); c.stroke();
  c.strokeStyle = T.mark; c.lineWidth = lw * 1.8;
  [.08, .42].forEach(f => { const x = lerp(x0, xe, f), hh = lerp(hb, hm, f) - lw; c.beginPath(); c.moveTo(x, -hh); c.lineTo(x, hh); c.stroke(); });
  // 심지: 남은 길이만큼 그린다
  const f0 = { x: x0 + bw * .2, y: -hb * .92 }, f1 = { x: x0 - bw * .02, y: -hb - bw * .38 }, f2 = { x: x0 - bw * .32, y: -hb - bw * .5 };
  c.strokeStyle = T.chalk; c.lineWidth = lw * 1.1; c.beginPath(); c.moveTo(f0.x, f0.y);
  let tip = f0;
  for (let i = 1; i <= 12; i++) {
    const u = i / 12 * Cannon.fuse, a = 1 - u;
    tip = { x: a * a * f0.x + 2 * a * u * f1.x + u * u * f2.x, y: a * a * f0.y + 2 * a * u * f1.y + u * u * f2.y };
    c.lineTo(tip.x, tip.y);
  }
  c.stroke();
  return tip;
}

/* ---------- 바로 뽑기 (이름이 빠르게 돌다 멈춘다) ---------- */
function setFace(ball, n, cls) {
  const [c0, hi, lo] = colorOf(n), s = ballText(n);
  ball.className = 'ball' + (cls ? ' ' + cls : '');
  ball.style.cssText = `--c:${c0};--hi:${hi};--lo:${lo};--fs:${fitSize(s).toFixed(3)}`;
  ball.innerHTML = `<span class="face">${esc(s)}</span>`;
}
async function quickSpin(n, slot, poolSnap) {
  const ball = slot.querySelector('.ball'), opts = poolSnap.length > 1 ? poolSnap : [n];
  let d = .05, total = 0, prev = -1;
  stock--;
  while (total < (calm() ? .4 : 1.2)) {
    let m; do { m = opts[randInt(opts.length)]; } while (opts.length > 2 && m === prev);
    prev = m; setFace(ball, m); void ball.offsetWidth; ball.classList.add('spin'); Sound.tick();
    await wait(d); total += d; d *= 1.17;
  }
}

/* ---------- 결과 자리 ---------- */
const slotEls = () => [...el.slots.querySelectorAll('.slot')];
function buildSlots() {
  const n = S.pick, roles = n === 1 ? ['뽑힌 사람'] : ['첫 번째', '두 번째'];
  el.slots.dataset.n = n;
  el.slots.innerHTML = roles.map((r, i) =>
    `<figure class="slot"><figcaption class="role">${r}</figcaption><div class="ball empty"><span class="q">?</span></div></figure>` +
    (n === 2 && i === 0 ? `<div class="pair-link" aria-hidden="true"><svg viewBox="0 0 64 24"><path d="M6 12h52M14 4 6 12l8 8M50 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>함께</div>` : '')
  ).join('');
}
function fillSlot(slot, n, pop) {
  const ball = slot.querySelector('.ball');
  setFace(ball, n);
  if (pop) { void ball.offsetWidth; ball.classList.add('pop'); }
}
function noneSlot(slot) {
  const ball = slot.querySelector('.ball');
  ball.className = 'ball empty none'; ball.style.cssText = ''; ball.innerHTML = '<span class="q">없음</span>';
  slot.querySelector('.role').textContent = '남은 사람이 없어요';
}
function showLast() {
  const last = cur().rounds[cur().rounds.length - 1];
  if (!last || last.length > S.pick) return;
  last.forEach((n, i) => { const s = slotEls()[i]; if (s && inRange(cur(), n)) fillSlot(s, n, false); });
}
function celebrate(slot, i) {
  const c = centerOf(slot);
  confetti(c.x, c.y, c.r); Sound.chime(i);
}

/* ---------- 그리기 반복 ---------- */
let lastT = 0;
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  if (S.machine === 'lotto') drawLotto(); else if (S.machine === 'cannon') drawCannon();
  drawParts(); drawFlyers();
}
function frame(now) {
  if (!lastT) lastT = now;
  const dt = Math.min(.05, Math.max(0, (now - lastT) / 1000)); lastT = now; clock += dt;
  Lotto.update(dt); Cannon.update(dt); updateParts(dt); runTweens();
  render();
  requestAnimationFrame(frame);
}

/* ---------- 화면 갱신 ---------- */
function setSeg(seg, v) { seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === String(v)))); }
function renderHeader() {
  const d = new Date();
  el.today.textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`;
  el.teamName.textContent = `${cur().name} ${size()}명`;
}
function renderTray() {
  const c = cur(), p = poolOf(c), a = awaySet(c).size;
  setSeg(el.segPick, S.pick); setSeg(el.segMachine, S.machine);
  document.querySelectorAll('.tray .seg button').forEach(b => { b.disabled = busy; });
  el.undo.disabled = busy || !c.rounds.length;
  el.reset.disabled = busy || !c.rounds.length;
  el.setBtn.disabled = busy;
  el.draw.disabled = busy;
  const out = !p.length;
  el.drawLabel.textContent = busy ? '뽑는 중' : (out ? '처음부터' : '뽑기');
  el.drawKey.hidden = busy || out;
  el.left.textContent = `남은 ${p.length}명` + (a ? ` · 빠짐 ${a}명` : '');
  el.icoOn.hidden = !S.sound; el.icoOff.hidden = S.sound;
  el.sound.setAttribute('aria-label', S.sound ? '소리 끄기' : '소리 켜기');
  el.fs.setAttribute('aria-label', document.fullscreenElement ? '전체 화면 끝내기' : '전체 화면');
}
function renderRoll() {
  const c = cur(), done = new Map(), away = awaySet(c);
  c.rounds.forEach((r, ri) => r.forEach(n => { if (inRange(c, n)) done.set(n, ri + 1); }));
  let order = 0; const nth = new Map(); c.rounds.forEach(r => r.forEach(n => { if (inRange(c, n)) nth.set(n, ++order); }));
  const last = new Set(c.rounds[c.rounds.length - 1] || []);
  let html = '';
  for (let i = 1; i <= size(c); i++) {
    const s = away.has(i) ? 'away' : done.has(i) ? 'done' : 'left';
    const who = label(i), [c0, hi, lo] = colorOf(i);
    const tip = s === 'away' ? `${who}: 오늘 빠짐. 누르면 다시 넣어요` : s === 'done' ? `${who}: ${nth.get(i)}번째로 뽑힘. 누르면 다시 넣어요` : `${who}: 누르면 오늘은 빼고 뽑아요`;
    html += `<button type="button" class="num" data-n="${i}" data-s="${s}"${s === 'done' && last.has(i) ? ' data-last' : ''} title="${esc(tip)}" aria-label="${esc(tip)}"><span class="dot" style="--c:${c0};--hi:${hi};--lo:${lo}"></span>${esc(who)}</button>`;
  }
  el.nums.innerHTML = html;
  el.nLeft.textContent = poolOf(c).length; el.nDone.textContent = done.size; el.nAway.textContent = away.size;
}
function renderUnder() {
  const empty = slotEls().every(s => s.querySelector('.ball').classList.contains('empty'));
  const out = !poolOf().length && !busy;
  el.done.hidden = !out;
  el.hint.hidden = out;
  el.hint.style.visibility = empty && !busy ? 'visible' : 'hidden';
}
function renderAll() {
  el.stage.dataset.machine = S.machine;
  if (!busy) stock = poolOf().length;
  renderHeader(); renderTray(); renderRoll(); renderUnder();
}
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
let toastTimer = 0;
function toast(msg) {
  el.toast.textContent = msg; el.toast.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.toast.classList.remove('on'), 2400);
}
function say(msg) { el.live.textContent = ''; setTimeout(() => { el.live.textContent = msg; }, 30); }

/* ---------- 동작 ---------- */
async function draw() {
  if (busy) return;
  Sound.init(); keepAwake();
  const c = cur(), p = poolOf(c);
  if (!p.length) { openReset(); return; }
  const k = Math.min(S.pick, p.length), picks = pickSome(p, k);
  c.rounds.push(picks); save();
  busy = true; stock = p.length;
  document.body.classList.add('busy');
  buildSlots(); if (k < S.pick) noneSlot(slotEls()[1]);
  renderTray(); renderUnder();
  const mode = S.machine;
  try {
    for (let i = 0; i < k; i++) {
      const slot = slotEls()[i];
      if (mode === 'lotto') await Lotto.draw(picks[i], slot, i, k);
      else if (mode === 'cannon') await Cannon.draw(picks[i], slot, i);
      else await quickSpin(picks[i], slot, p);
      fillSlot(slot, picks[i], true); celebrate(slot, i);
      if (i < k - 1) await wait(calm() ? .2 : .5);
    }
  } catch (err) {
    console.error(err);
    picks.forEach((n, i) => { const s = slotEls()[i]; if (s) fillSlot(s, n, false); });
  } finally {
    busy = false; Cannon.idle = true; Lotto.mixTarget = 0; Sound.airStop();
    document.body.classList.remove('busy');
    Lotto.sync(poolOf());
    renderAll();
    say(jo(picks.map(label).join(', '), '이', '가') + ' 뽑혔어요');
    if (!poolOf(c).length) Sound.tada();
  }
}
function undo() {
  if (busy) return;
  const c = cur(); if (!c.rounds.length) return;
  const r = c.rounds.pop(); save();
  buildSlots(); Lotto.sync(poolOf()); renderAll();
  toast(jo(r.map(label).join(', '), '을', '를') + ' 다시 넣었어요');
}
function openReset() {
  if (busy) return;
  const n = drawnSet().size, a = awaySet().size;
  el.resetMsg.textContent = `지금까지 뽑힌 ${n}명을 모두 다시 넣고 처음부터 뽑아요.` + (a ? ` 오늘 빠짐 표시한 ${a}명은 그대로 빠져 있어요.` : '');
  el.resetDlg.returnValue = '';
  el.resetDlg.showModal();
}
function doReset() {
  const c = cur(); c.rounds = []; save();
  buildSlots(); Lotto.sync(poolOf()); renderAll();
  toast('모두 다시 넣었어요. 처음부터 뽑아요');
}
function setPick(n) {
  if (busy || S.pick === n) return;
  S.pick = n; save(); buildSlots(); renderAll();
}
function setMachine(m) {
  if (busy || S.machine === m) return;
  S.machine = m; save(); renderAll();
}
function toggleSound() {
  S.sound = !S.sound; save();
  if (!S.sound) Sound.airStop(); else Sound.init();
  renderTray(); toast(S.sound ? '소리를 켰어요' : '소리를 껐어요');
}
function toggleFull() {
  try {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    const p = root.requestFullscreen && root.requestFullscreen();
    if (!p) toast('브라우저에서 F11을 누르면 전체 화면이 돼요');
    else if (p.catch) p.catch(() => toast('브라우저에서 F11을 누르면 전체 화면이 돼요'));
  } catch (e) { toast('브라우저에서 F11을 누르면 전체 화면이 돼요'); }
}
function refreshClass() {
  Lotto.setSize(size()); Lotto.rebuild(poolOf());
  buildSlots(); showLast(); renderAll();
}
let wl = null, touched = false;
async function keepAwake() {
  touched = true;
  try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && touched) keepAwake(); });

/* 참가자 이름 누르기: 남음 → 빠짐, 빠짐 → 남음, 뽑힘 → 남음 */
el.nums.addEventListener('click', e => {
  const b = e.target.closest('.num'); if (!b || busy) return;
  const c = cur(), n = +b.dataset.n;
  if (drawnSet(c).has(n)) { c.rounds = c.rounds.map(r => r.filter(x => x !== n)).filter(r => r.length); toast(jo(label(n), '을', '를') + ' 다시 넣었어요'); }
  else if (awaySet(c).has(n)) { c.away = c.away.filter(x => x !== n); toast(jo(label(n), '을', '를') + ' 다시 넣었어요'); }
  else { c.away.push(n); c.awayDay = dayKey(); toast(jo(label(n), '은', '는') + ' 오늘 빼고 뽑아요'); }
  save(); Lotto.sync(poolOf()); renderAll();
});
el.draw.addEventListener('click', draw);
el.undo.addEventListener('click', undo);
el.reset.addEventListener('click', openReset);
el.sound.addEventListener('click', toggleSound);
el.fs.addEventListener('click', toggleFull);
el.segPick.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setPick(+b.dataset.v); });
el.segMachine.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMachine(b.dataset.v); });
el.resetDlg.addEventListener('close', () => { if (el.resetDlg.returnValue === 'ok') doReset(); });
document.addEventListener('fullscreenchange', renderTray);
// 마우스로 누른 버튼에 초점이 남으면 스페이스바가 그 버튼을 다시 누르게 되므로 풀어 준다
document.addEventListener('click', e => { const b = e.target.closest('button'); if (b && e.detail > 0 && !b.closest('dialog')) b.blur(); });

addEventListener('keydown', e => {
  if (e.defaultPrevented || document.querySelector('dialog[open]')) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z' || k === 'ㅋ')) { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === ' ' || k === 'Enter' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown') {
    if ((k === ' ' || k === 'Enter') && t && t.tagName === 'BUTTON' && t !== el.draw) return;
    e.preventDefault(); if (!e.repeat) draw(); return;
  }
  if (k === 'f' || k === 'F' || k === 'ㄹ') { toggleFull(); return; }
  if (k === 'm' || k === 'M' || k === 'ㅡ') { toggleSound(); return; }
  if (k === '1') setPick(1);
  if (k === '2') setPick(2);
});

/* ---------- 설정 창 ---------- */
const readNames = () => el.fNames.value.split(/\r?\n/).map(x => x.trim()).filter(Boolean).slice(0, 99);
function fillSettings() {
  const c = cur();
  el.fName.value = c.name;
  el.fNames.value = c.names.join('\n');
  setSeg(el.segBoard, S.board === 'white' ? 'white' : 'chalk');
  namesInfo();
}
function namesInfo() {
  const n = readNames().length;
  el.fInfo.textContent = n < 2 ? '2명 이상 적어 주세요. 그 전까지는 지금 명단 그대로예요.' : `${n}명이 들어가요. 창을 닫으면 공이 바뀌어요.`;
}
// 뽑힌 기록과 빠짐 표시는 이름을 따라간다 (순서를 바꾸거나 한 명을 빼도 엉키지 않게)
function applyNames() {
  const c = cur(), next = readNames();
  if (next.length < 2 || next.join('\n') === c.names.join('\n')) return;
  const move = n => next.indexOf(c.names[n - 1]) + 1;
  c.rounds = c.rounds.map(r => r.map(move).filter(n => n > 0)).filter(r => r.length);
  c.away = c.away.map(move).filter(n => n > 0);
  c.names = next; save(); refreshClass();
}
el.setBtn.addEventListener('click', () => { if (busy) return; fillSettings(); el.setDlg.showModal(); });
el.setDlg.addEventListener('close', applyNames);
el.fName.addEventListener('input', () => { cur().name = el.fName.value.trim() || '우리 팀'; save(); renderHeader(); });
el.fNames.addEventListener('input', namesInfo);
el.fNames.addEventListener('change', applyNames);
el.segBoard.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.board = b.dataset.v; save(); applyBoard(); setSeg(el.segBoard, S.board);
});

/* ---------- 시작 ---------- */
applyBoard(); resize();
// 열 때마다 빈 통에 공이 위에서 하나씩 쏟아져 들어간다
Lotto.setSize(size()); Lotto.rebuild([]); Lotto.sync(poolOf());
buildSlots(); showLast(); renderAll();
if (document.fonts && document.fonts.load) { document.fonts.load('20px "Jua"'); document.fonts.load('700 20px "Gaegu"'); }
requestAnimationFrame(frame);
})();
</script>

</html>
